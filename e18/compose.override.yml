# E18: replace the model with a canned-response stub (e18/SPEC.md §3.2).
# Use with: docker compose -f <moca>/deploy/compose/docker-compose.yml -f e18/compose.override.yml up -d
services:
  stub:
    image: ${SH_HARNESS_IMAGE:-ghcr.io/rossoctl/moca:latest}
    command: [node, /stub/stub.mjs]
    working_dir: /tmp
    environment:
      PORT: '8099'
      STUB_DELAY_MS: ${STUB_DELAY_MS:-200}
    volumes:
      - ${E18_DIR:?set E18_DIR to the absolute path of e18/}/lib/stub.mjs:/stub/stub.mjs:ro
    ports:
      - 127.0.0.1:${E18_STUB_PORT:-18099}:8099
    networks: [moca-brain]
    restart: unless-stopped
  supervisor:
    environment:
      ANTHROPIC_BASE_URL: http://stub:8099
      ANTHROPIC_API_KEY: stub-key
    depends_on: [stub]
